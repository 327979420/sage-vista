name: Recover Saved Unified V2 Backfill

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Failed backfill run whose weekly artifacts already succeeded
        required: true
      start:
        description: First requested date, used only for the audit commit
        required: true
      end:
        description: Last requested date, used only for the audit commit
        required: true

permissions:
  actions: read
  contents: write

concurrency:
  group: sage-vista-v2-backfill-publish
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Restore historical EOD cache for elapsed outcomes
        uses: actions/cache@v4
        with:
          path: |
            work/eodhd-cache
            work/eodhd-active-common.json
          key: eodhd-history-v1-${{ github.run_id }}
          restore-keys: eodhd-history-v1-
      - name: Download every saved weekly result without recalculating
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ inputs.source_run_id }}" --pattern 'unified-v2-*' --dir work/v2-parts
      - name: Flatten downloaded weekly artifact folders
        run: find work/v2-parts -mindepth 2 -type f -name '*.json' -exec cp '{}' work/v2-parts/ \;
      - name: Require all requested weekly checkpoints
        run: |
          test "$(find work/v2-parts -maxdepth 1 -type f -name '*.json' | wc -l)" -ge 9
          python3 - <<'PY'
          import glob,json
          paths=glob.glob("work/v2-parts/*.json")
          assert paths
          reports=[json.load(open(path)) for path in paths]
          assert all(report.get("future_data_used") is False for report in reports)
          assert all(report.get("model",{}).get("trigger") for report in reports)
          assert all(all("triggered_count" in day for day in report.get("days",[])) for report in reports)
          PY
      - name: Synchronize latest production data before merging
        run: git pull --rebase origin main
      - name: Merge saved weeks and rebuild the permanent ledger
        run: |
          python3 -m services.scanner.merge_unified_v2_reports public/unified-v2-rankings.json work/v2-parts/*.json --out public/unified-v2-rankings.json
          python3 -m services.scanner.opportunity_ledger
      - name: Validate recovered output
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Commit recovered research output
        run: |
          git config user.name "sage-vista-bot"
          git config user.email "sage-vista-bot@users.noreply.github.com"
          git add public/unified-v2-rankings.json public/opportunity-ledger.json
          git diff --cached --quiet && exit 0
          git commit -m "data: recover Unified V2 backfill ${{ inputs.start }} to ${{ inputs.end }}"
          git push origin HEAD:main
      - name: Deploy the recovered website data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-site.yml --ref main
