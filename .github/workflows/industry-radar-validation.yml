name: CR056 cached input coverage audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache/restore@v4
        id: history
        with:
          path: |
            work/eodhd-cache
            work/eodhd-active-common.json
          key: eodhd-history-v1-33293559230
          fail-on-cache-miss: true
      - name: Summarize existing cached inputs only
        env:
          RESTORED_KEY: ${{ steps.history.outputs.cache-matched-key }}
        run: |
          python3 - <<'PY'
          import collections, datetime, json, os
          from pathlib import Path
          as_of = json.loads(Path('public/update-status.json').read_text())['source_latest_complete_date']
          cutoff = datetime.date.fromisoformat(as_of)
          hist = collections.Counter()
          enough_months = 0
          exact = 0
          invalid = 0
          selected = {}
          files = list(Path('work/eodhd-cache').glob('*.json'))
          for p in files:
              try:
                  rows = json.loads(p.read_text())
                  if not isinstance(rows, list): raise ValueError('not rows')
                  days = sorted({str(r['date']) for r in rows if str(r['date']) <= as_of})
                  if not days: raise ValueError('empty as of')
                  hist[days[-1]] += 1
                  months = {d[:7] for d in days if d[:7] < as_of[:7]}
                  enough_months += len(months) >= 61
                  exact += days[-1] == as_of
                  if p.stem in {'SPY','QQQ','SAIA','LNT','ALLY','SOXX'}:
                      selected[p.stem] = {'first_date':days[0], 'last_date':days[-1], 'rows':len(days), 'observed_prior_months':len(months), 'recent_dates':days[-8:]}
              except (ValueError, KeyError, TypeError):
                  invalid += 1
          result = {'as_of':as_of, 'restored_key':os.environ['RESTORED_KEY'], 'cache_files':len(files), 'invalid_or_empty_files':invalid, 'last_date_counts':dict(sorted(hist.items())), 'at_least_61_observed_prior_months':enough_months, 'exact_as_of_files':exact, 'selected_metadata':selected, 'scope':'input_coverage_only_not_strategy_eligibility', 'raw_market_data_uploaded':False, 'network_provider_calls':0}
          Path('work/cr056-input-coverage.json').write_text(json.dumps(result, indent=2))
          print(json.dumps(result, indent=2))
          if not files: raise SystemExit('No restored input files')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cr056-input-coverage-${{ github.run_id }}
          path: work/cr056-input-coverage.json
          retention-days: 7
          if-no-files-found: error
