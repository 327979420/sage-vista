name: Industry Radar Real Data Validation

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: Optional completed EOD date (YYYY-MM-DD); blank uses EODHD latest
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: industry-radar-real-data-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Require existing EODHD secret
        shell: bash
        run: test -n "$EODHD_API_TOKEN" || { echo "EODHD_API_TOKEN secret is not configured"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Restore Industry Radar EOD cache
        uses: actions/cache@v4
        with:
          path: work/eodhd-cache
          key: industry-radar-eod-${{ github.run_id }}
          restore-keys: industry-radar-eod-
      - name: Run Industry Radar with EODHD
        shell: bash
        env:
          REQUESTED_AS_OF: ${{ inputs.as_of }}
        run: |
          args=(--out public/industry-radar.json)
          if [ -n "$REQUESTED_AS_OF" ]; then args+=(--as-of "$REQUESTED_AS_OF"); fi
          python3 -m services.scanner.industry_radar "${args[@]}" > industry-radar-run-summary.json
      - name: Validate point-in-time output
        shell: bash
        env:
          REQUESTED_AS_OF: ${{ inputs.as_of }}
        run: |
          python3 - <<'PY'
          import json,os
          from services.scanner.eodhd import latest_reference_day
          report=json.load(open("public/industry-radar.json"))
          expected=os.environ.get("REQUESTED_AS_OF") or latest_reference_day()
          if report.get("as_of")!=expected:raise SystemExit(f"as_of mismatch: {report.get('as_of')} != {expected}")
          if report.get("future_data_used") is not False:raise SystemExit("future-data audit failed")
          if report.get("historical_membership_safe") is not True:raise SystemExit("membership audit failed")
          audit=report.get("price_data_audit",{})
          if audit.get("provider")!="EODHD" or audit.get("errors_redacted") is not True:raise SystemExit("price-data audit missing")
          if not audit.get("fetched_tickers"):raise SystemExit("EODHD returned no constituent histories")
          print(json.dumps({"as_of":report["as_of"],"themes":len(report["themes"]),"fetched":len(audit["fetched_tickers"]),"unavailable":len(audit["unavailable_tickers"])},indent=2))
          PY
      - name: Run Industry Radar tests
        run: python3 -m unittest tests.test_industry_radar -v
      - name: Upload validated Radar JSON
        uses: actions/upload-artifact@v4
        with:
          name: industry-radar-${{ inputs.as_of || 'latest' }}-${{ github.run_id }}
          path: public/industry-radar.json
          if-no-files-found: error
          retention-days: 14
