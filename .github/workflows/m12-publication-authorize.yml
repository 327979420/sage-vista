name: M12 authorization validation (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # Activation requires the separate rollout card and server identity policy.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the triggering immutable commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Set up the fixed Python runtime
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12.12'
          architecture: x64
          check-latest: false
      - name: Validate and archive through the controlled coordinator
        shell: bash
        run: python -I -B "$GITHUB_WORKSPACE/services/publication/authorization_runtime.py"
