name: M12 daily chain (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily:
    # Launch card must approve activation; current code stops after intake.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout fixed source and its approved policy baseline
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
          submodules: false
          lfs: false
      - name: Set up the fixed Python runtime
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12.12'
          architecture: x64
          check-latest: false
      - name: Run the fixed daily entry
        shell: bash
        env:
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
        run: python -I -B "$GITHUB_WORKSPACE/services/publication/daily_runtime.py"
