name: Sage Vista EOD Freshness Monitor

on:
  workflow_run:
    workflows: ["Refresh Opportunity Ledger"]
    types: [completed]
  # Separate late check after all normal EOD retry windows. repository_dispatch
  # also permits an external scheduler to invoke the same audit in the future.
  schedule:
    - cron: "30 4 * * 2-6"
  workflow_dispatch:
  repository_dispatch:
    types: [eod-freshness-check]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  freshness:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - name: Require provider secret
        run: test -n "$EODHD_API_TOKEN" || { echo "EODHD_API_TOKEN secret is not configured"; exit 1; }
      - name: Compare repository with provider
        id: freshness
        shell: bash
        run: |
          python3 -m services.scanner.freshness_monitor --url https://sage-vista-parallel.gizmo-allied-0s.workers.dev > freshness-result.json
          python3 - <<'PY'
          import json,os
          result=json.load(open("freshness-result.json"))
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write(f"result={result['result']}\n")
              out.write(f"provider_latest={result['provider_latest']}\n")
          PY
      - name: Dispatch one idempotent recovery update
        if: steps.freshness.outputs.result == 'stale'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run daily-eod.yml --ref main -f mode=deploy -f notify=false -f trigger_source=freshness_recovery
      - name: Open one deduplicated stale-data issue
        if: steps.freshness.outputs.result == 'stale'
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER_LATEST: ${{ steps.freshness.outputs.provider_latest }}
        shell: bash
        run: |
          title="EOD freshness stale: provider ${PROVIDER_LATEST}"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq length)
          if [ "$existing" = "0" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file freshness-result.json
          fi
      - name: Upload freshness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-freshness-${{ github.run_id }}
          path: freshness-result.json
          if-no-files-found: warn
          retention-days: 14
      - name: Fail visibly when stale
        if: steps.freshness.outputs.result == 'stale'
        run: exit 1

  observation_resume:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Refresh Opportunity Ledger' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Retry failed observation shards only, preserving original commit and checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" > jobs.json
          if python3 -c 'import json;raise SystemExit(0 if any(j["name"].startswith("observation_shards") and j["conclusion"] in ("failure","timed_out") for j in json.load(open("jobs.json"))["jobs"]) else 1)'; then
            gh run rerun "$RUN_ID" --failed
          fi
