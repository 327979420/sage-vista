name: Open Source Industry Snapshot

on:
  schedule:
    - cron: "20 12 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: open-source-industry-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Resolve source revision and snapshot tracked universe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day=$(date -u +%F)
          ref=$(gh api repos/JerBouma/FinanceDatabase/commits/main --jq .sha)
          out="data/industry/finance-database-${day}.json"
          if [ ! -f "$out" ]; then
            python3 -m services.scanner.open_source_industry --effective-from "$day" --ref "$ref" --out "$out"
          fi
      - name: Validate adapters and leakage rules
        run: python3 -m unittest tests.test_open_source_industry tests.test_industry_radar -v
      - name: Commit new dated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/industry/finance-database-*.json
          git diff --cached --quiet || git commit -m "data: open-source industry snapshot $(date -u +%F)"
          git push
