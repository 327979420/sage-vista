name: Research Lab

# Runs pre-registered experiments from research/lab/queue in the background.
# Each spec runs once per frozen content; results, the cumulative scoreboard and
# the experiment lifecycle are committed to main. Scheduled outside the EOD
# window (23:30-04:30 UTC); the runner also refuses to publish inside it.
on:
  schedule:
    # Right after the 23:30-04:30 UTC EOD window closes, and again later in case GitHub skips a run.
    - cron: "45 4 * * *"
    - cron: "15 8 * * *"
  workflow_dispatch:
    inputs:
      wait_for_window:
        description: "Started inside the 23:30-04:30 UTC EOD window: minutes the run may wait at the end for the window to close before publishing (0 = do not start inside it)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: sage-vista-research-lab
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    timeout-minutes: 340
    env:
      EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      SV_DATA_REPO: 327979420/sage-vista-data
      SV_DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.14" }
      - name: Restore the daily price cache read-only (ledger datasets)
        uses: actions/cache/restore@v4
        with:
          path: |
            work/eodhd-cache
            work/eodhd-active-common.json
          key: eodhd-history-v1-research-lab-${{ github.run_id }}
          restore-keys: eodhd-history-v1-
      - name: Validate the lab engine before using it
        run: python3 -m unittest tests.test_research_lab tests.test_experiment_catalog
      - name: Check the lab account still matches the approved VectorBT account
        run: |
          python3 -m venv work/vectorbt-env
          work/vectorbt-env/bin/python -m pip install --only-binary=:all: --require-hashes -r research/backtest/dependencies/vectorbt-requirements.lock
          work/vectorbt-env/bin/python -m unittest tests.test_research_lab.AccountTests
      # Owner approved 2026-10-19: one failing queue spec must not skip the daily forward record and scoring.
      # The failure is reported as an error annotation and in the summary; the job is not failed, so the Discord job
      # that needs it still runs.
      - name: Run pending experiments and publish results
        id: queue
        continue-on-error: true
        env:
          WAIT_FOR_WINDOW: ${{ inputs.wait_for_window || '0' }}
        run: python3 -m research.lab.run_queue --publish --max-specs 3 --wait-for-window "$WAIT_FOR_WINDOW"
      - name: Update the forward paper accounts
        run: python3 -m research.lab.forward --publish
      - name: Restore the frozen datasets and daily bulk bars for the triangle forward record
        uses: actions/cache@v4
        with:
          path: |
            work/lab/universe-1985-v1-*.json.gz
            work/lab/fresh-*-1995-v1-*.json.gz
            work/lab/sector-etf-1998-to-2026-10-v1-*.json.gz
            work/triangle-bulk
          key: triangle-forward-v1-${{ github.run_id }}
          restore-keys: triangle-forward-v1-
      - name: Update the weekly triangle forward record
        run: python3 -m research.lab.triangle_forward --publish
      # Owner approved 2026-10-19 (tasks 036/038). Scoring reads the caches the forward step just used; a scoring
      # failure must not block the app data below, so it is reported instead of stopping the job.
      - name: Score the frozen forward record and owner picks from the same local caches
        id: scoring
        continue-on-error: true
        run: |
          python3 -m research.lab.forward_judge
          python3 -m research.lab.own_picks compute
      - name: Build the weekly trade review after scoring
        id: trade_review
        if: steps.scoring.outcome == 'success' && github.event.schedule == '45 4 * * *'
        run: |
          if [ "$(date -u +%u)" = 6 ]; then
            python3 -m research.lab.trade_review
            echo "written=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Keep the weekly trade review
        if: steps.trade_review.outputs.written == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trade-review-${{ github.run_id }}
          path: |
            work/trade-review/weekly-*.html
            work/trade-review/weekly-*.json
          if-no-files-found: error
      - name: Keep the forward scorecards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forward-scorecards-${{ github.run_id }}
          path: |
            work/forward-judge/latest.*
            research/lab/own_picks/outcomes.json
          if-no-files-found: warn
      - name: Build the app data
        id: app_data
        run: python3 -m research.lab.app_data --publish
      - name: Deploy changed app data
        if: steps.app_data.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import subprocess
          from research.lab.run_queue import in_eod_window

          if in_eod_window():
              raise SystemExit('Deployment deferred: inside the 23:30-04:30 UTC EOD window')
          subprocess.run(['gh', 'workflow', 'run', 'deploy-site.yml', '--ref', 'main'], check=True)
          PY
      - name: Summarise
        if: always()
        run: |
          echo "## Research lab" >> "$GITHUB_STEP_SUMMARY"
          git fetch -q origin main && git show origin/main:research/lab/SCOREBOARD.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "No scoreboard yet." >> "$GITHUB_STEP_SUMMARY"
      - name: Report a failed experiment queue
        if: steps.queue.outcome == 'failure'
        run: |
          echo "::error::The experiment queue failed; the forward record and scoring still ran. See the 'Run pending experiments' step."
          echo "**Experiment queue failed** — forward record and scoring still ran." >> "$GITHUB_STEP_SUMMARY"

  triangle_discord:
    name: Notify frozen 3W opportunities
    needs: run
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The producer publishes via an isolated index; use a fresh main snapshot.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with: { python-version: "3.14" }
      - name: Test frozen 3W notifications
        run: python3 -m unittest tests.test_triangle_discord tests.test_triangle15 tests.test_app_data
      - name: Preview 3W notifications without a secret
        run: python3 -m services.scanner.triangle_discord > triangle-discord-preview.json
      - uses: actions/upload-artifact@v4
        with:
          name: triangle-discord-preview
          path: triangle-discord-preview.json
          retention-days: 7
      - name: Send new opportunities with durable deduplication
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.DISCORD_OPPORTUNITY }}
        run: python3 -m services.scanner.triangle_discord --send
