name: Guardrails

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Frozen code and locked data guard
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: python3 scripts/guardrails.py "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" $LABELS
