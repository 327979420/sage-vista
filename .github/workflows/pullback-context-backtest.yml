name: Pullback Context Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/cache@v4
        with:
          path: |
            work/eodhd-cache
            work/eodhd-active-common.json
          key: eodhd-history-v1-${{ github.run_id }}
          restore-keys: eodhd-history-v1-
      - run: test "$(find work/eodhd-cache -type f -name '*.json' | wc -l)" -ge 1000
      - run: python3 -m services.scanner.cache_theme_etfs
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 -m research.backtest.pullback_context_backtest_v2
      - name: Validate report
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open("research/backtest/output/pullback-context-v2.json"))
          if r.get("version")!="pullback-context-backtest-v2.0.0":raise SystemExit("wrong version")
          if r.get("audit",{}).get("stock_trades",0)<1000 or r.get("audit",{}).get("industry_trades",0)<20:raise SystemExit("sample too small")
          if r.get("audit",{}).get("current_membership_backfilled"):raise SystemExit("unsafe membership backfill")
          PY
      - name: Commit report
        run: |
          git config user.name "sage-vista-research-bot"
          git config user.email "sage-vista-research-bot@users.noreply.github.com"
          git add research/backtest/output/pullback-context-v2.json
          git commit -m "research: pullback context backtest v2"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: pullback-context-backtest-${{ github.run_id }}
          path: research/backtest/output/pullback-context-v2.json
          retention-days: 30
