name: Core Factor Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sage-vista-core-factor-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Restore historical EOD cache
        uses: actions/cache@v4
        with:
          path: |
            work/eodhd-cache
            work/eodhd-active-common.json
          key: eodhd-history-v1-${{ github.run_id }}
          restore-keys: eodhd-history-v1-
      - name: Require historical universe
        shell: bash
        run: test "$(find work/eodhd-cache -type f -name '*.json' | wc -l)" -ge 1000
      - name: Run all Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Run point-in-time core-factor backtest
        run: python3 -m services.scanner.macd_factor_backtest
      - name: Validate research report
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          report=json.load(open("public/macd-factor-backtest.json"))
          core=report.get("core_model_v1_tests",{})
          if core.get("version")!="core-factor-backtest-v1.0.0":raise SystemExit("missing core v1 report")
          if not core.get("tests"):raise SystemExit("empty core v1 report")
          if report.get("universe",{}).get("eligible",0)<1000:raise SystemExit("historical universe too small")
          PY
      - name: Commit versioned research result
        shell: bash
        run: |
          git config user.name "sage-vista-research-bot"
          git config user.email "sage-vista-research-bot@users.noreply.github.com"
          git add public/macd-factor-backtest.json
          git diff --cached --quiet && exit 0
          git commit -m "research: core factor backtest v1"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload full research report
        uses: actions/upload-artifact@v4
        with:
          name: core-factor-backtest-${{ github.run_id }}
          path: public/macd-factor-backtest.json
          retention-days: 30
