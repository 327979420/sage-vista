name: Deploy Website Only

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "services/scanner/project_status.py"
      - "docs/CURRENT_STATUS_ZH.md"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - ".github/workflows/deploy-site.yml"

permissions:
  contents: write

concurrency:
  group: sage-vista-production-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: "22.13.0"
  PRODUCTION_SITE_URL: https://sage-vista-parallel.gizmo-allied-0s.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Sync latest production main
        id: production_head
        run: |
          git fetch origin main
          git switch --detach origin/main
          echo "deployment_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - name: Verify repository status snapshot is current
        run: |
          python3 -m services.scanner.project_status > /dev/null
          git diff --exit-code -- docs/CURRENT_STATUS_ZH.md
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build and test website
        env:
          GITHUB_SHA: ${{ steps.production_head.outputs.deployment_commit }}
        run: npm test
      - name: Require deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy existing audited data and website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:cloudflare
      - name: Verify live website and write deployment receipt
        run: |
          expected_as_of=$(python3 -c 'import json;print(json.load(open("public/update-status.json"))["source_latest_complete_date"])')
          python3 -m services.scanner.verify_live_deployment verify --url "$PRODUCTION_SITE_URL" --expected-as-of "$expected_as_of" --deployment-commit "${{ steps.production_head.outputs.deployment_commit }}" > live-verification.json
      - name: Upload deployment receipt
        uses: actions/upload-artifact@v4
        with:
          name: website-deployment-receipt-${{ github.run_id }}
          path: live-verification.json
          retention-days: 30
      - name: Persist verified website identity
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "sage-vista-bot"
          git config user.email "sage-vista-bot@users.noreply.github.com"
          git pull --rebase origin main
          python3 -m services.scanner.verify_live_deployment persist --receipt-path live-verification.json --state-path automation/production-state.json > /dev/null
          python3 -m services.scanner.project_status > /dev/null
          git add automation/production-state.json docs/CURRENT_STATUS_ZH.md
          git diff --cached --quiet && exit 0
          git commit -m "state: record verified website deployment [skip ci]"
          git push origin HEAD:main
