name: Deploy Website Only

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "services/scanner/project_status.py"
      - "docs/CURRENT_STATUS_ZH.md"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - ".github/workflows/deploy-site.yml"

permissions:
  contents: read

concurrency:
  group: sage-vista-site-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: "22.13.0"
  PRODUCTION_SITE_URL: https://sage-vista-parallel.gizmo-allied-0s.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - name: Verify repository status snapshot is current
        run: |
          python3 -m services.scanner.project_status > /dev/null
          git diff --exit-code -- docs/CURRENT_STATUS_ZH.md
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build and test website
        run: npm test
      - name: Require deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy existing audited data and website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:cloudflare
      - name: Verify the published UI build
        run: |
          for attempt in 1 2 3 4 5; do
            page=$(curl --fail --silent --show-error "$PRODUCTION_SITE_URL?deployment=$GITHUB_SHA" || true)
            if printf '%s' "$page" | grep -Fq "Build ${GITHUB_SHA:0:7}"; then break; fi
            if [ "$attempt" = "5" ]; then exit 1; fi
            sleep 6
          done
