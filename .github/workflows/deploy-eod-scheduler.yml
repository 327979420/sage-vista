name: Deploy EOD Scheduler

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SCHEDULER_GITHUB_TOKEN: ${{ secrets.SAGE_VISTA_SCHEDULER_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci
      - name: Require deployment and least-privilege scheduler secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured"; exit 1; }
          test -n "$SCHEDULER_GITHUB_TOKEN" || { echo "SAGE_VISTA_SCHEDULER_GITHUB_TOKEN is not configured"; exit 1; }
      - name: Store the GitHub token as an encrypted Cloudflare Worker secret
        shell: bash
        run: printf '%s' "$SCHEDULER_GITHUB_TOKEN" | npx wrangler secret put GITHUB_ACTIONS_TOKEN --config wrangler.eod-scheduler.jsonc
      - name: Deploy independent Cloudflare Cron scheduler
        run: npm run deploy:eod-scheduler
      - name: Record scheduler contract
        run: |
          {
            echo "# Sage Vista Independent EOD Scheduler"
            echo
            echo "- Worker: **sage-vista-eod-scheduler**"
            echo "- Primary EOD trigger: **Cloudflare Cron**"
            echo "- Backup trigger: **GitHub schedule**"
            echo "- Recovery: **independent freshness dispatch**"
            echo "- GitHub token: **encrypted Cloudflare secret; value never logged**"
          } >> "$GITHUB_STEP_SUMMARY"
